<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem conexão • Orbyta</title>
  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9fafb;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
    }
    .icon { font-size: 64px; margin-bottom: 20px; display: block; }
    h1 { font-size: 1.5rem; color: #111; margin-bottom: 10px; }
    p { color: #6b7280; font-size: 0.97rem; line-height: 1.6; margin-bottom: 28px; }
    .btn {
      display: inline-block;
      background: #f97316;
      color: #fff;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      border: none;
      cursor: pointer;
    }
    .btn:hover { background: #ea6c0a; }
    .brand {
      margin-top: 32px;
      color: #d1d5db;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">O</span>
    <h1>Você está offline</h1>
    <p>
      Parece que você perdeu a conexão com a internet.<br>
      Verifique sua rede e tente novamente.
    </p>
    <button class="btn" onclick="window.location.reload()">Tentar novamente</button>
    <p class="brand">Orbyta • Agendamentos online</p>
  </div>
</body>
</html>
